<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bejaHexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="bejaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Translucent Wing Gradient -->
    <linearGradient id="bejaWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="bejaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Hexagon Border -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"
           fill="url(#bejaHexBg)"
           stroke="url(#bejaGold)"
           stroke-width="4.5"
           stroke-linejoin="round"
           filter="url(#bejaGlow)"/>

  <!-- Inner Hexagonal Grid Accent -->
  <polygon points="50,11 84,30.5 84,69.5 50,89 16,69.5 16,30.5"
           fill="none"
           stroke="#f59e0b"
           stroke-width="1.2"
           stroke-opacity="0.3"
           stroke-linejoin="round"/>

  <!-- ==================== THE BEE ==================== -->
  <g id="beja-bee">
    <!-- Antennae -->
    <path d="M46,28 Q37,17 31,21" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="31" cy="21" r="2.2" fill="#fbbf24"/>
    <path d="M54,28 Q63,17 69,21" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="69" cy="21" r="2.2" fill="#fbbf24"/>

    <!-- Left Wings (Forewing & Hindwing) -->
    <path d="M44,39 C18,27 15,48 43,48 Z" fill="url(#bejaWing)" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M44,45 C25,43 26,57 45,53 Z" fill="url(#bejaWing)" stroke="#fbbf24" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Right Wings (Forewing & Hindwing) -->
    <path d="M56,39 C82,27 85,48 57,48 Z" fill="url(#bejaWing)" stroke="#f59e0b" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M56,45 C75,43 74,57 55,53 Z" fill="url(#bejaWing)" stroke="#fbbf24" stroke-width="1.3" stroke-linejoin="round"/>

    <!-- Bee Head -->
    <ellipse cx="50" cy="32" rx="7.5" ry="5.5" fill="url(#bejaGold)"/>
    <!-- Compound Eyes (Dark Tactical) -->
    <ellipse cx="46" cy="31" rx="1.8" ry="2.2" fill="#070a12"/>
    <ellipse cx="54" cy="31" rx="1.8" ry="2.2" fill="#070a12"/>

    <!-- Thorax (Center Armor Plate) -->
    <path d="M43,37 L57,37 L61,48 L50,54 L39,48 Z" fill="url(#bejaGold)" stroke="#b45309" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Thorax Micro Core Light -->
    <polygon points="50,42 53,46 50,50 47,46" fill="#fff" opacity="0.8"/>

    <!-- Abdomen (Segmented Stripes) -->
    <!-- Segment 1: Dark Strip -->
    <path d="M42,53.5 L58,53.5 L56,60 L44,60 Z" fill="#0c1322" stroke="#d97706" stroke-width="0.8"/>
    <!-- Segment 2: Gold Strip -->
    <path d="M44,60 L56,60 L54.5,66.5 L45.5,66.5 Z" fill="url(#bejaGold)"/>
    <!-- Segment 3: Dark Strip -->
    <path d="M45.5,66.5 L54.5,66.5 L53,73 L47,73 Z" fill="#0c1322" stroke="#d97706" stroke-width="0.8"/>
    <!-- Segment 4: Gold Tip -->
    <path d="M47,73 L53,73 L51.5,77 L48.5,77 Z" fill="url(#bejaGold)"/>

    <!-- Stinger -->
    <polygon points="48.5,77 51.5,77 50,83" fill="#fbbf24"/>
  </g>
</svg>
